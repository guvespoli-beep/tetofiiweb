name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  schedule:
    # Atualiza automaticamente de segunda a sexta, de hora em hora das 10h às 19h (Horário de Brasília / UTC 13h às 22h)
    - cron: '0 13-22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync latest B3 live quotes & CVM official VP
        run: npx tsx scripts/update-quotes.mjs

      - name: Build app
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
