<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Neon Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b074" />
      <stop offset="100%" stop-color="#00ffaa" />
    </linearGradient>

    <!-- Building Shading Gradient -->
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- App Icon Base Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.5" />

  <!-- Outer Neon Aura behind buildings -->
  <path d="M 170 340 L 170 260 L 256 120 L 342 260 L 342 340 Z" fill="#00e599" opacity="0.12" filter="url(#glow)" />

  <!-- Left Low Tower -->
  <path d="M 160 340 L 160 255 L 195 235 L 210 245 L 210 340 Z" fill="url(#buildingGrad)" stroke="#00e599" stroke-width="4.5" stroke-linejoin="round" />
  <line x1="160" y1="280" x2="210" y2="280" stroke="#00e599" stroke-width="2.5" opacity="0.6" />
  <line x1="160" y1="310" x2="210" y2="310" stroke="#00e599" stroke-width="2.5" opacity="0.6" />

  <!-- Right Low Tower -->
  <path d="M 302 340 L 302 260 L 325 245 L 352 260 L 352 340 Z" fill="url(#buildingGrad)" stroke="#00e599" stroke-width="4.5" stroke-linejoin="round" />
  <line x1="302" y1="285" x2="352" y2="285" stroke="#00e599" stroke-width="2.5" opacity="0.6" />
  <line x1="302" y1="315" x2="352" y2="315" stroke="#00e599" stroke-width="2.5" opacity="0.6" />

  <!-- Main Central Skyscraper Tower with Brick Texture -->
  <path d="M 200 340 L 200 200 L 312 135 L 312 340 Z" fill="url(#buildingGrad)" stroke="#00ffaa" stroke-width="5" stroke-linejoin="round" />

  <!-- Brick Texture Lines on Central Tower -->
  <g stroke="#00e599" stroke-width="2.5" opacity="0.65">
    <line x1="200" y1="225" x2="312" y2="225" />
    <line x1="200" y1="250" x2="312" y2="250" />
    <line x1="200" y1="275" x2="312" y2="275" />
    <line x1="200" y1="300" x2="312" y2="300" />
    <line x1="200" y1="325" x2="312" y2="325" />

    <!-- Vertical Bricks alternating -->
    <line x1="230" y1="200" x2="230" y2="225" />
    <line x1="275" y1="200" x2="275" y2="225" />
    <line x1="250" y1="225" x2="250" y2="250" />
    <line x1="290" y1="225" x2="290" y2="250" />
    <line x1="225" y1="250" x2="225" y2="275" />
    <line x1="270" y1="250" x2="270" y2="275" />
    <line x1="245" y1="275" x2="245" y2="300" />
    <line x1="290" y1="275" x2="290" y2="300" />
    <line x1="225" y1="300" x2="225" y2="325" />
    <line x1="270" y1="300" x2="270" y2="325" />
  </g>

  <!-- Ground Horizon Base Line -->
  <line x1="145" y1="340" x2="367" y2="340" stroke="#00ffaa" stroke-width="6" stroke-linecap="round" />

  <!-- Prominent Ascending Growth Arrow (Bolsa de Valores) -->
  <g filter="url(#glow)">
    <polyline points="190,265 235,215 270,230 320,120" fill="none" stroke="url(#arrowGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrowhead pointing up and right -->
    <polygon points="320,105 328,145 295,130" fill="url(#arrowGrad)" />
  </g>

  <!-- Typography: TETO FII -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="54" letter-spacing="4">
    <text x="110" y="418" fill="#ffffff">TETO</text>
    <text x="305" y="418" fill="#00e599">FII</text>
  </g>
</svg>
